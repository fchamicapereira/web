<div class="counter">
  <div class="prose">
    {{ content }}
    <div class="socials">
      {{ social }}
    </div>
  </div>
  <figure class="filmstrip">
    <div class="frame">
      <img src="/assets/img/prof_pic-800.webp" srcset="/assets/img/prof_pic-480.webp 480w, /assets/img/prof_pic-800.webp 800w" sizes="(max-width: 760px) 17rem, 19rem" alt="{{ name }}" width="800" height="840">
    </div>
    <div class="edge-print" aria-hidden="true"><span>35MM ▸ 24 FPS</span><span>▸ 237</span></div>
  </figure>
</div>

<div class="recent">
  <div class="view-head">
    <p class="eyebrow">Recent releases</p>
    <h2>Recent publications</h2>
  </div>
  {{ selected_papers }}
</div>
