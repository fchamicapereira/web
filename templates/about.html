<div class="post">

  <header class="post-header">
    <h1 class="post-title">
      <span class="font-weight-bold">{{ first_name }}</span> {{ last_name }}
    </h1>
    <p class="desc about-desc-fix"></p>
    <div class="social">
      <div class="contact-icons">
        {{ social }}
      </div>
      <div class="contact-note"></div>
    </div>
  </header>

  <article>
    <div class="profile float-right">
      <figure>
        <picture>
          <source media="(max-width: 480px)" srcset="/assets/img/prof_pic-480.webp"></source>
          <source media="(max-width: 800px)" srcset="/assets/img/prof_pic-800.webp"></source>
          <source media="(max-width: 1400px)" srcset="/assets/img/prof_pic-1400.webp"></source>
          <img class="img-fluid z-dept-1 rounded" src="/assets/img/prof_pic.jpeg" alt="prof_pic.jpeg">
        </picture>
      </figure>
    </div>

    <div class="clearfix">
      {{ content }}
    </div>

    <div class="publications">
      <h2>Recent publications</h2>
      {{ selected_papers }}
    </div>
  </article>

</div>
