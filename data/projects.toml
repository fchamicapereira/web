# Project posters on /projects/. Projects are grouped by category, and both
# categories and projects appear in the order they are listed here.

# What each category is called in the lobby.
[categories]
research = "Now showing"
tutorials = "Special screening"

# Poster fields: `presents` is the small line at the top, `slogan` sits under
# the title, `billing` is the credits block at the bottom, and `color`/`glow`
# set the poster's background and the light behind the title.

[[project]]
title = "Maestro"
description = "Automatically parallelizes sequential software Network Functions, configuring NIC RSS to spread traffic across CPU cores while preserving their original behavior."
url = "https://maestro.inesc-id.pt/"
github = "https://github.com/snaplab-dpss/maestro"
category = "research"
presents = "An NSDI ’24 picture"
slogan = "One function. Every core."
billing = "Francisco Pereira · Fernando M. V. Ramos · Luis Pedrosa — NSDI ’24"
color = "#0d1016"
glow = "rgba(169, 193, 214, .22)"

[[project]]
title = "SyNAPSE"
description = "A compiler that automatically generates Network Function accelerators across x86 and Tofino, exploring how to split work between them according to a target goal."
url = "https://synapse.inesc-id.pt/"
github = "https://github.com/synapse-nfs/synapse-sosr22"
category = "research"
presents = "An SOSR ’22 picture"
slogan = "Split the work. Find the best way to divide it."
billing = "Francisco Pereira · Gonçalo Matos · Hugo Sadok · Daehyeok Kim · Ruben Martins · Justine Sherry · Fernando M. V. Ramos · Luis Pedrosa — SOSR ’22"
color = "#101113"
glow = "rgba(228, 231, 235, .12)"

[[project]]
